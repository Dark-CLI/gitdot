[font]
size = 16.0


[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[window]
# Padding (margins) in pixels.
padding = { x = 15, y = 15 }
# Opacity - mostly dark background with slight transparency (0.9 = 90% opaque, 10% transparent)
opacity = 0.9
# line_spacing =1

[font.offset]
x = 0
y = 0

[general]
working_directory = "/home/max"

import = [
    "~/.config/alacritty/wallust/colors-alacritty.toml"
]



# [debug]
# Enable automatic config reloading when the configuration file changes.
# reload_config_on_save = true
