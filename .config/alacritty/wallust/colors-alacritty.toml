# /* wallust template - colors-alacritty */
# Uses harddark16 palette for better color distinction and contrast

[colors.primary]
foreground = "#B4BDC2"
background = "#0F1012"
dim_foreground = "#616A70"
bright_foreground = "#8B98A0"

[colors.cursor]
text = "#0F1012"
cursor = "#B4BDC2"

[colors.vi_mode_cursor]
text = "#0F1012"
cursor = "#0C171E"

[colors.selection]
text = "#B4BDC2"
background = "#37383A"

# Normal colors - use darker/saturated versions
[colors.normal]
black   = "#37383A"
red     = "#0C171E"
green   = "#111F27"
yellow  = "#1E313C"
blue    = "#1E313D"
magenta = "#1E313D"
cyan    = "#1E313D"
white   = "#8B98A0"

# Bright colors - much lighter for better contrast
[colors.bright]
black   = "#616A70"
red     = "#101F28"
green   = "#162A34"
yellow  = "#284250"
blue    = "#284251"
magenta = "#284251"
cyan    = "#284251"
white   = "#8B98A0"

[colors.indexed_colors]
16  = "#0C171E"
17  = "#111F27"
18  = "#1E313C"
19  = "#1E313D"
20  = "#1E313D"
21  = "#1E313D"
