onboarding = false

[keys]
prefix = "ctrl+s"
split_vertical = "prefix+="
split_horizontal = "prefix+minus"
close_pane = "ctrl+x"
new_workspace = "prefix+shift+c"
goto = ["prefix+g", "ctrl+w"]
rename_workspace = "prefix+shift+r"
rename_tab = "prefix+shift+t"
detach = "prefix+q"
focus_workspace_1 = "ctrl+1"
focus_workspace_2 = "ctrl+2"
focus_workspace_3 = "ctrl+3"
focus_workspace_4 = "ctrl+4"
focus_workspace_5 = "ctrl+5"
focus_workspace_6 = "ctrl+6"
focus_workspace_7 = "ctrl+7"
focus_workspace_8 = "ctrl+8"
focus_workspace_9 = "ctrl+9"

[ui]
prompt_new_tab_name = false
prompt_new_workspace_name = true
sidebar_start_collapsed = true

agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
[ui.sound]
enabled = false

[theme]
name = "vesper"
auto_switch = false

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true
