# Monitor profile: dual-monitor
# LG secondary (left, portrait) + ASUS primary (right)
# See Hyprland wiki: https://wiki.hyprland.org/Configuring/Monitors/

# LG secondary monitor: 1600x900 rotated 90°, DPI-matched scale 0.78
monitor=HDMI-A-2,1600x900@60,0x0,0.78

# ASUS primary monitor: 2560x1440, positioned right of LG
monitor=DP-2,2560x1440@143.97,1154x0,1.0

# Workspace distribution
# Workspaces 5,6,7 on secondary (LG)
# Workspaces 1-4,8-10 on primary (ASUS)
