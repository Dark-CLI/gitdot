$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh

# wallpaper stuff / More wallpaper options below (swww-daemon already started by configs/Startup_Apps.conf)
exec-once = swww-daemon --format xrgb
#exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes 

# Startup (already done by configs/Startup_Apps.conf)
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit (already started by configs/Startup_Apps.conf)
# exec-once = $scriptsDir/Polkit.sh

# Activate the systemd graphical-session.target via the wrapper at
# ~/.config/systemd/user/hyprland-session.target. Without this,
# xdg-desktop-portal won't start, so screen sharing in Discord / OBS
# / browsers gets no source-picker dialog.
exec-once = systemctl --user --no-block start hyprland-session.target

# Core startup apps (waybar, nm-applet, swaync already started by configs/Startup_Apps.conf)
# exec-once = waybar &
# exec-once = nm-applet --indicator &
# exec-once = swaync &

# Custom apps
exec-once = firefox &
# exec-once = Discord & 
# exec-once = flatpak run com.spotify.Client

# Feishin - Navidrome music player
exec-once = ~/.local/share/feishin/Feishin.AppImage --no-sandbox &

