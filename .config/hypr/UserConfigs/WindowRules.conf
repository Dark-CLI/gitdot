# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# ============================================
# CUSTOM WINDOW RULES - Migrated from v2.3.13
# ============================================

# Dropdown terminal - ensure floating in scratchpad workspace
windowrulev2 = float, workspace:special:scratchpad

# Custom workspace assignments
windowrule = workspace 10, class:^(discord)$
windowrule = workspace 10, class:^(org.telegram.desktop)$
windowrule = workspace 10, class:^(Spotify)$
windowrule = workspace 10, class:^(feishin)$

# Dropdown terminal - float and position at top
windowrule = float, title:^(Dropdown Terminal)$
windowrule = size 54% 67%, title:^(Dropdown Terminal)$
windowrule = move 1% 2%, title:^(Dropdown Terminal)$
windowrule = animation slide, title:^(Dropdown Terminal)$

# Blur for alacritty windows via layer rule (follows wallpaper theme)
layerrule = blur, ^(kitty|Alacritty)$
