# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# /* wallust template - colors-tmux */
# Placeholder - will be generated by wallust

# Panes
set -g pane-border-style 'fg=#7B7F80'
set -g pane-active-border-style 'fg=#727C81'

# Status bar
set -g status-style 'fg=#B0B5B8 bg=#17171A'
set -g status-left '#[fg=#191E2B,bold][ #S ]#[default]    '
set -g status-right-style 'fg=#727C81 bg=#17171A'

# Window status
setw -g window-status-current-style 'fg=#0E111B,bold bg=#17171A'
setw -g window-status-style 'fg=#B0B5B8 bg=#17171A'
setw -g window-status-bell-style 'fg=#191E2B,bold bg=#17171A'

# Copy mode
setw -g mode-style 'fg=#0E111B bg=#3D3E41 bold'

# Messages
set -g message-style 'fg=#191E2B,bold bg=#17171A'

# Clock
setw -g clock-mode-colour #727C81
