# Alacritty colors from wallust theme with saturated font colors

[colors.primary]
background = "{{background}}"
foreground = "{{foreground}}"
dim_foreground = "{{color8}}"
bright_foreground = "{{color7}}"

[colors.cursor]
text = "{{background}}"
cursor = "{{foreground}}"

[colors.selection]
text = "{{color7}}"
background = "{{color0}}"

# ANSI Colors - wallust bright colors with saturation boost
[colors.normal]
black   = "{{color0}}"
red     = "{{color9 | saturate(0.3)}}"
green   = "{{color10 | saturate(0.3)}}"
yellow  = "{{color11 | saturate(0.3)}}"
blue    = "{{color12 | saturate(0.3)}}"
magenta = "{{color13 | saturate(0.3)}}"
cyan    = "{{color14 | saturate(0.3)}}"
white   = "{{color7}}"

[colors.bright]
black   = "{{color8}}"
red     = "{{color9 | saturate(0.3)}}"
green   = "{{color10 | saturate(0.3)}}"
yellow  = "{{color11 | saturate(0.3)}}"
blue    = "{{color12 | saturate(0.3)}}"
magenta = "{{color13 | saturate(0.3)}}"
cyan    = "{{color14 | saturate(0.3)}}"
white   = "{{color15}}"
