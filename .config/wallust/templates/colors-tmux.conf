# /* wallust template - colors-tmux */

# Panes borders
set -g pane-border-style 'fg={{color8}}'
set -g pane-active-border-style 'fg={{color14 | saturate(0.3)}}'

# Pane background - match terminal background
set -g pane-border-fg {{background}}
set -g pane-border-bg {{background}}
set -g pane-active-border-fg {{color14 | saturate(0.3)}}
set -g pane-active-border-bg {{background}}

# Status bar - match terminal background
set -g status-justify left
set -g status-bg {{background}}
set -g status-fg {{color7}}
set -g status-left '#[fg={{color11 | saturate(0.3)}},bold][ #S ]'
set -g status-left-length 15
set -g status-right-style 'fg={{color14 | saturate(0.3)}} bg={{background}}'

# Window status - current window is DARK/DIM, other windows are bright
setw -g window-status-current-style 'fg={{color8}} bg={{background}} dim'
setw -g window-status-style 'fg={{color9 | saturate(0.3)}} bg={{background}}'
setw -g window-status-bell-style 'fg={{color11 | saturate(0.3)}},bold bg={{background}}'

# Copy mode - dim selection
setw -g mode-style 'fg={{color7}} bg={{color0}} dim'

# Messages
set -g message-style 'fg={{color11 | saturate(0.3)}},bold bg={{background}}'

# Clock
setw -g clock-mode-colour {{color14 | saturate(0.3)}}
