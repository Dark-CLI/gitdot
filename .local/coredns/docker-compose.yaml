version: '3.8'

services:
  dnsmasq:
    image: jpillora/dnsmasq:latest
    container_name: dnsmasq
    networks:
      services:
        ipv4_address: 10.0.0.254
    volumes:
      - ${HOME}/.local/coredns/dnsmasq.conf:/etc/dnsmasq.conf:z
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    security_opt:
      - label:disable

networks:
  services:
    external: true
    name: services
