user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Navidrome
    server {
        server_name navidrome.home;
        listen 80;
        listen 443 ssl http2;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://10.0.0.5:3005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Ollama
    server {
        server_name ollama.home;
        listen 80;
        listen 443 ssl http2;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://10.0.0.3:11434;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Open-WebUI
    server {
        server_name open-webui.home webui.home;
        listen 80;
        listen 443 ssl http2;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://10.0.0.4:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # OpenSpeedtest
    server {
        server_name openspeedtest.home speedtest.home;
        listen 80;
        listen 443 ssl http2;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://10.0.0.6:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Catch-all for unknown hosts
    server {
        listen 80 default_server;
        listen 443 ssl http2 default_server;

        ssl_certificate /etc/nginx/certs/wildcard.crt;
        ssl_certificate_key /etc/nginx/certs/wildcard.key;

        location / {
            return 404;
        }
    }
}
