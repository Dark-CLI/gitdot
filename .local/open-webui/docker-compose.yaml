services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      services:
        ipv4_address: 10.0.0.3
    ports:
      - "3003:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    runtime: nvidia
    security_opt:
      - label:disable
    dns:
      - 10.0.0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    networks:
      services:
        ipv4_address: 10.0.0.4
    ports:
      - "3004:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    security_opt:
      - label:disable
    dns:
      - 10.0.0.1

volumes:
  ollama_data:
    external: true
    name: smarthub_ollama_data
  open-webui:
    external: true

networks:
  services:
    external: true
    name: services
