##### ── CUSTOM SHORTCUTS (DOCS) ─────────────────────────────────────────────
# Prefix = Ctrl-s
#
# Shortcuts:
#   Prefix + C   : New session (prompts for name).
#   Prefix + s   : FZF session switcher (pick a session, jump there).
#   Prefix + ?   : Show current session name on-screen. (Overrides tmux help.)
#   Prefix + R   : Rename current session (prefills with current name).
#   Ctrl-q       : Kill current session (no prefix, asks confirm).
#
# Copy mode (scroll back):  ENTER with C-k
#   In copy mode:  hjkl = move cursor;  u = half-page up, d = half-page down
#   EXIT: q or Enter
#
# Status bar:
#   Left shows current session name (#S). Right shows date/time.
#
# NOTE: If Ctrl-s/Ctrl-q ever freeze your terminal, disable XON/XOFF:
#   run:  stty -ixon
##### ────────────────────────────────────────────────────────────────────────


# Reload config with Ctrl-s r
unbind r
bind r source-file ~/.tmux.conf

# Set prefix to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# kill a window
bind & kill-window

# Vertical split (right) - start in current directory
bind | split-window -h -c "#{pane_current_path}"

# Horizontal split (below) - start in current directory
bind - split-window -v -c "#{pane_current_path}"

# New window - start in current directory
bind c new-window -c "#{pane_current_path}"

# Window chooser (global: no prefix needed)
bind -n C-w choose-window

# ── Sessions ────────────────────────────────────────────────────────────────
# Create new session (prompts for a name)
bind C command-prompt -p "New session name:" "new-session -s '%%'"

# Session switcher via fzf (overrides default choose-tree on 's')
# bind s run-shell "tmux list-sessions -F '#{session_name}' | fzf-tmux | xargs -r tmux switch-client -t"

# Show current session name in a popup/message (overrides default help on '?')
bind ? display-message "Session: #S"

# Rename current session (prefilled with current name)
bind R command-prompt -I '#S' "rename-session '%%'"

# Kill current session with Ctrl+q (no prefix) + confirmation
bind -n C-q kill-session

# ── Indexing ────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Auto-change directory for new windows/panes ────────────────────────────
# Make new windows and panes start in the same directory as the current pane
# (Note: bind c is already defined above, these are for default tmux bindings)
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Navigation ──────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── DESIGN TWEAKS ───────────────────────────────────────────────────────────
# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Source static colors matching kitty theme
source ~/.config/tmux/colors-static.conf

# Default window format
setw -g window-status-current-format ' [#I] #W '
setw -g window-status-format ' [#I] #W '

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-left-length 35
set -g status-right '%y-%m-%d %H:%M:%S '
set -g status-right-length 50
set -g status-interval 1

# === NICE SCROLLING AND COPY ===
set -g mouse on
setw -g mode-keys vi

# Fast repeat when holding keys (j/k scroll continuously while held)
set -g repeat-time 50

# Enter copy mode with C-Space (no prefix)
bind -n C-Space copy-mode

# In copy mode: hjkl = move cursor; u/d = half-page up/down
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right
bind -T copy-mode-vi u send-keys -X halfpage-up
bind -T copy-mode-vi d send-keys -X halfpage-down

bind -T copy-mode-vi WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind -T copy-mode-vi S-PageUp   send-keys -X page-up
bind -T copy-mode-vi S-PageDown send-keys -X page-down
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection

# Mouse selection: drag to select and copy, stays in copy mode
bind -T copy-mode-vi MouseDown1Pane send -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane send -X begin-selection \; send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
